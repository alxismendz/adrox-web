# Despliegue de ADROX en Azure Static Web Apps.
#
# Requisitos (ver README.md, sección "Despliegue en Azure"):
#   1. Crear el recurso Static Web App en Azure (plan Free o Standard).
#   2. Copiar su "deployment token" y guardarlo en GitHub como secreto del
#      repositorio con el nombre AZURE_STATIC_WEB_APPS_API_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret).
#   3. (Opcional) Crear la variable del repositorio SITE_URL con la URL pública
#      (Settings → Secrets and variables → Actions → Variables).
#
# El sitio se compila en GitHub Actions y se sube la carpeta dist/ ya generada.

name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Compilar y desplegar
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos y compilar
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Desplegar en Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Cerrar entorno de vista previa
    steps:
      - name: Cerrar entorno de vista previa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
